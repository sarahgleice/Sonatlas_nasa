site_name: SONATLAS
site_description: "Explore Earth Through Sound — Portal Institucional e Científico Oficial"
site_author: "UNICEPLAC Software Developers — NASA Space Apps Challenge 2026"
site_url: "https://sarahgleice.github.io/Sonatlas_nasa/"
repo_name: "sarahgleice/Sonatlas_nasa"
repo_url: "https://github.com/sarahgleice/Sonatlas_nasa"
copyright: "Copyright &copy; 2026 SONATLAS Team (UNICEPLAC Software Developers) — Licença MIT — NASA Space Apps Challenge 2026"

theme:
  name: material
  language: pt-BR
  logo: assets/images/favicon.svg
  favicon: assets/images/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    # Modo Escuro (Default - Estética Espacial e Alta Acessibilidade)
    - scheme: slate
      primary: custom
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Alternar para Modo Claro
    # Modo Claro
    - scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Alternar para Modo Escuro
  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - "Institucional":
      - "Visão Geral": index.md
      - "Visão do Produto": 01-visao-produto/index.md
      - "Equipe e Governança": 12-equipe/index.md
  - "Ciência & Dados":
      - "Metodologia Científica": 06-dados-cientificos/index.md
      - "Auditoria de Reprodutibilidade": 06-dados-cientificos/auditoria-reprodutibilidade-imerg.md
      - "Contrato da Grade Espacial": 06-dados-cientificos/contrato-grade-espacial.md
      - "Sonificação Psicoacústica": 07-sonificacao/index.md
  - "Acessibilidade & Design":
      - "Inclusão & Acessibilidade": 08-acessibilidade/index.md
      - "Personas e Usuários": 02-personas/index.md
      - "Histórias de Usuário": 04-historias-usuario/index.md
  - "Engenharia & Arquitetura":
      - "Arquitetura do Sistema": 09-arquitetura/index.md
      - "Requisitos do Sistema": 03-requisitos/index.md
      - "Testes e Validação": 10-testes/index.md
      - "Metodologia Ágil": 05-metodologia/index.md
      - "Guia do Desenvolvedor": 11-desenvolvimento/index.md
